# Root wrangler.toml — shared configuration for all workers
# This file defines service bindings, queues, and D1 database bindings
# for the Autoengineering system.

# =============================================================================
# MANAGER WORKER
# =============================================================================
[[env.manager]]
name = "autoengineering-manager"
main = "apps/manager/src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[env.manager.vars]
ENVIRONMENT = "production"

# Service bindings to supervisor workers
[env.manager.services]
PLAN_SUPERVISOR_SERVICE = { binding = "PLAN_SUPERVISOR_SERVICE", service = "autoengineering-plan-supervisor" }

# Queue bindings for async task dispatch
[[env.manager.queues]]
binding = "CODE_GEN_QUEUE"
queue = "autoengineering-code-gen-queue"

[[env.manager.queues]]
binding = "VERIFICATION_QUEUE"
queue = "autoengineering-verification-queue"

# D1 database binding
[[env.manager.d1_databases]]
binding = "DB"
database_name = "autoengineering-db"
database_id = "autoengineering-db-id"

# =============================================================================
# PLAN SUPERVISOR WORKER
# =============================================================================
[[env.plan-supervisor]]
name = "autoengineering-plan-supervisor"
main = "apps/plan-supervisor/src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[env.plan-supervisor.vars]
ENVIRONMENT = "production"

# Service bindings (plan-supervisor calls back to manager or other supervisors)
[env.plan-supervisor.services]
MANAGER_SERVICE = { binding = "MANAGER_SERVICE", service = "autoengineering-manager" }

# Queue bindings for dispatching implementation tasks
[[env.plan-supervisor.queues]]
binding = "CODE_GEN_QUEUE"
queue = "autoengineering-code-gen-queue"

[[env.plan-supervisor.queues]]
binding = "VERIFICATION_QUEUE"
queue = "autoengineering-verification-queue"

# D1 database binding
[[env.plan-supervisor.d1_databases]]
binding = "DB"
database_name = "autoengineering-db"
database_id = "autoengineering-db-id"

# =============================================================================
# QUEUE DEFINITIONS
# =============================================================================
[[queues]]
name = "autoengineering-code-gen-queue"
max_retries = 3
max_batch_size = 1
max_batch_timeout = 30

[[queues]]
name = "autoengineering-verification-queue"
max_retries = 3
max_batch_size = 1
max_batch_timeout = 30

# =============================================================================
# D1 DATABASE DEFINITIONS
# =============================================================================
[[d1_databases]]
binding = "DB"
database_name = "autoengineering-db"
database_id = "autoengineering-db-id"

# =============================================================================
# ENVIRONMENTS
# =============================================================================
[env.production]

[env.staging]

[env.development]

# =============================================================================
# ROUTES
# =============================================================================
[env.manager.routes]
pattern = "api.autoengineering.dev/*"
zone_id = "autoengineering-zone-id"

[env.plan-supervisor.routes]
pattern = "internal.autoengineering.dev/plan-supervisor/*"
zone_id = "autoengineering-zone-id"
