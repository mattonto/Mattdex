name = "autoengineering-manager"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
DATABASE_URL = ""
GIT_CONFIG = ""

# Service bindings to supervisor workers
[[services]]
binding = "SPEC_SUPERVISOR"
service = "autoengineering-spec-supervisor"

[[services]]
binding = "PLAN_SUPERVISOR"
service = "autoengineering-plan-supervisor"

[[services]]
binding = "IMPLEMENTATION_SUPERVISOR"
service = "autoengineering-implementation-supervisor"

# D1 database binding (for session/state storage)
[[d1_databases]]
binding = "DB"
database_name = "autoengineering-state"
database_id = ""

# Queue bindings for async task dispatch
[[queues]]
binding = "CODE_GEN_QUEUE"
queue = "autoengineering-code-gen"

[[queues]]
binding = "VERIFICATION_QUEUE"
queue = "autoengineering-verification"

# R2 bucket for artifact storage
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "autoengineering-artifacts"

# Environment-specific overrides
[env.production]
vars = { DATABASE_URL = "", GIT_CONFIG = "" }

[env.staging]
vars = { DATABASE_URL = "", GIT_CONFIG = "" }
