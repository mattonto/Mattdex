name = "manager"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
DATABASE_URL = ""
GIT_CONFIG = ""

# Service bindings to supervisor workers
[[services]]
binding = "SUPERVISOR_SPEC"
service = "supervisor-spec"

[[services]]
binding = "SUPERVISOR_PLAN"
service = "plan-supervisor"

[[services]]
binding = "SUPERVISOR_IMPLEMENTATION"
service = "supervisor-implementation"

# Queue producers (manager enqueues work for task workers)
[[queues.producers]]
binding = "CODE_GEN_QUEUE"
queue = "code-gen-tasks"

[[queues.producers]]
binding = "VERIFICATION_QUEUE"
queue = "verification-tasks"

# KV namespace for session cache
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = ""

# R2 bucket for plan artifacts
[[r2_buckets]]
binding = "PLAN_ARTIFACTS"
bucket_name = "plan-artifacts"

# D1 database for plan state (fallback / local dev)
[[d1_databases]]
binding = "PLAN_DB"
database_name = "plan-db"
database_id = ""

# Environment-specific overrides
[env.production]
vars = { DATABASE_URL = "", GIT_CONFIG = "" }

[env.staging]
vars = { DATABASE_URL = "", GIT_CONFIG = "" }

[env.development]
vars = { DATABASE_URL = "", GIT_CONFIG = "" }
