name = "autoengineering-plan-supervisor"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
DATABASE_URL = ""
GIT_CONFIG = ""

# Service binding to the manager (for callbacks/results)
[[services]]
binding = "MANAGER"
service = "autoengineering-manager"

# D1 database binding for reading/writing state
[[d1_databases]]
binding = "DB"
database_name = "autoengineering-state"
database_id = ""

# Queue bindings
[[queues]]
binding = "CODE_GEN_QUEUE"
queue = "autoengineering-code-gen"

[[queues]]
binding = "VERIFICATION_QUEUE"
queue = "autoengineering-verification"

# R2 bucket for reading spec artifacts
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "autoengineering-artifacts"

# Environment-specific overrides
[env.production]
vars = { DATABASE_URL = "", GIT_CONFIG = "" }

[env.staging]
vars = { DATABASE_URL = "", GIT_CONFIG = "" }
